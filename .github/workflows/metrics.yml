# Renders the profile graphs as SVGs into this repo (no third-party image hosts).
# Needs a classic personal access token saved as the METRICS_TOKEN secret with
# `repo` + `read:user` scopes, so private work counts toward the numbers
# (only totals are shown; private repository names never appear).
# Achievements and habits are left out: both crash on GitHub API changes in
# metrics v3.34, the latest release.
name: Metrics

on:
  schedule: [{ cron: "30 0 * * *" }]   # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

concurrency: metrics

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Commits, PRs opened/reviewed, issues, stars, followers + PR merge ratio
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.overview.svg
          committer_message: "chore(metrics): update overview [skip ci]"
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories
          base_indepth: yes
          plugin_followup: yes
          plugin_followup_sections: user

      # Full-year isometric contribution calendar
      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.calendar.svg
          committer_message: "chore(metrics): update calendar [skip ci]"
          config_timezone: Asia/Kolkata
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Most-used languages by bytes
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          committer_message: "chore(metrics): update languages [skip ci]"
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss, shell, dockerfile, makefile

