# Renders the profile graphs as SVGs into this repo (no third-party image hosts).
# Needs a classic personal access token saved as the METRICS_TOKEN secret with
# `repo` + `read:user` scopes, so private work counts toward the numbers
# (only totals are shown; private repository names never appear).
name: Metrics

on:
  schedule: [{ cron: "30 0 * * *" }]   # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

concurrency: metrics

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Commits, PRs opened/reviewed, issues, stars, followers + PR merge ratio + achievements
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.overview.svg
          committer_message: "chore(metrics): update overview [skip ci]"
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories
          base_indepth: yes
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_limit: 8

      # Full-year isometric contribution calendar
      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.calendar.svg
          committer_message: "chore(metrics): update calendar [skip ci]"
          config_timezone: Asia/Kolkata
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Most-used languages by bytes
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          committer_message: "chore(metrics): update languages [skip ci]"
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_ignored: html, css, scss, shell, dockerfile, makefile

      # When I code + lines added/removed over time
      - name: Habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.habits.svg
          committer_message: "chore(metrics): update habits [skip ci]"
          config_timezone: Asia/Kolkata
          base: ""
          plugin_habits: yes
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_days: 30
          plugin_lines: yes
          plugin_lines_sections: history
